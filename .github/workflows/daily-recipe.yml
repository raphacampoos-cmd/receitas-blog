name: Publicar receita diária

on:
  schedule:
    # 09:00 no horário de Lisboa/Brasília ~ ajuste conforme necessário (horário em UTC)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar nova receita com IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/gerar_receita.py

      - name: Reconstruir site estático
        run: python3 build.py

      - name: Commit e push das mudanças
        run: |
          git config user.name "receitas-bot"
          git config user.email "receitas-bot@users.noreply.github.com"
          git add content/receitas docs
          git diff --cached --quiet && echo "Nada novo para publicar" && exit 0
          git commit -m "Receita automática do dia $(date +'%Y-%m-%d')"
          git push
